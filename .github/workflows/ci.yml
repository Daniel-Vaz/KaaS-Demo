# CI gate: everything `make build test vet`, `make helm-lint`, the OpenTofu `validate` and the
# Ansible `--syntax-check` do locally, run on every push to main and every PR. Each language/tool
# gets its own job so failures are isolated and the checks run in parallel. Nothing here needs a
# hypervisor, a database or secrets - it is the fake/offline half of the build.
#
# It is also `workflow_call`-able, and the release workflows call it: a release re-runs this exact
# gate at the tagged commit before anything is published. That is deliberately a call rather than a
# copy - a release must not be able to pass a weaker set of checks than a PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to the same branch/PR supersedes an in-flight run. Keyed on the calling workflow too,
# so a release's nested CI run is never cancelled by an unrelated push to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The version drift check. VERSION is the platform version's single source of truth and both
  # Chart.yaml's appVersion and the portal's package.json mirror it; a drifted appVersion silently
  # makes the chart pull image tags nobody published. Catching that on the PR is the whole point -
  # by tag-push time the mistake is already a bad release. See docs/deploy/releasing.md.
  version:
    name: Version (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: make release-check

  go:
    name: Go (build · vet · test · fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # keep the toolchain pinned to go.mod (currently 1.26)
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Portal (type-check · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/portal/package-lock.json
      # --legacy-peer-deps: @xterm/addon-fit's stable line only declares a peer on @xterm/xterm
      # ^5.0.0 (the ^6.0.0-compatible release is still a beta); verified in-browser that xterm 6 +
      # addon-fit 0.10.0 render, accept input and resize correctly despite the unmet peer.
      - run: npm ci --legacy-peer-deps
      # `npm run build` is `tsc --noEmit && vite build` - type-check then bundle.
      - run: npm run build

  helm:
    name: Helm chart (lint · template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      # Mirrors `make helm-lint`, but vendors the Vault subchart first (there is no Chart.lock in
      # the tree, so `dependency update` pulls it) - `helm template` fails without it.
      - name: Lint and render the chart in every mode
        run: |
          helm dependency update deploy/helm/kaas
          helm lint deploy/helm/kaas
          helm template kaas deploy/helm/kaas --set providers=fake >/dev/null
          helm template kaas deploy/helm/kaas --set kvm.host=10.0.0.1 --set config.clusterSSH.publicKey=x >/dev/null
          helm template kaas deploy/helm/kaas --set kvm.mode=local --set config.clusterSSH.publicKey=x >/dev/null

  tofu:
    name: OpenTofu (fmt · validate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [libvirt, vsphere, proxmox]
    defaults:
      run:
        working-directory: infra/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - run: tofu fmt -check -recursive
      # -backend=false: validate the module offline, no state backend or provider credentials.
      - run: tofu init -backend=false
      - run: tofu validate

  ansible:
    name: Ansible (syntax-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # Only ansible.builtin is used, so ansible-core alone is enough - no extra collections.
      - run: pip install ansible-core
      - name: Syntax-check every playbook
        run: |
          rc=0
          for pb in playbooks/*.yml; do
            echo "== $pb =="
            ansible-playbook --syntax-check "$pb" || rc=1
          done
          exit $rc
