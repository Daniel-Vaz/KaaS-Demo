---
# Prepare a node for kubeadm and ensure containerd + kube* are present. Idempotent, and a near
# no-op on a golden image where these are pre-baked. Ubuntu-focused.
#
# The catalog's longhorn add-on also needs node-level prerequisites (iscsi/nfs/crypto tooling, its
# data engine kernel modules, hugepages) - those used to live here but are now baked into the golden
# image ONLY, by the `longhorn_prereqs` role in ansible/playbooks/golden-image.yml. Keeping them off
# the provisioning path (bootstrap/join/restore all run THIS role) is what makes cluster-create
# faster. See ansible/roles/longhorn_prereqs.

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Load kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Sysctl for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: '0644'

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Ensure apt keyrings dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install containerd and apt prerequisites
  ansible.builtin.apt:
    name:
      - containerd
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true

- name: Generate default containerd config with systemd cgroups
  ansible.builtin.shell: |
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable and (re)start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: restarted

- name: Add Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install kubelet, kubeadm, kubectl (pinned)
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}-*"
      - "kubeadm={{ k8s_version }}-*"
      - "kubectl={{ k8s_version }}-*"
    state: present
    update_cache: true
    # The golden image holds kube* at its baked version; allow re-converging to the bundle's
    # version if a stock/mismatched image is used (a no-op when they already match).
    # allow_downgrade covers the case where the image was baked NEWER than the bundle pins
    # (e.g. a 1.36 base image used for a 1.35 bundle) - apt refuses a downgrade with -y otherwise.
    allow_change_held_packages: true
    allow_downgrade: true

- name: Hold kube packages at pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
