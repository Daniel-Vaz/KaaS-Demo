---
# Apply the in-cluster half of the Vault integration: a ClusterSecretStore that points the External
# Secrets Operator at the central Vault, authenticating over the cluster's own per-cluster JWT auth
# role - so the operator can read ONLY this cluster's KV subtree. Invoked by
# internal/config/ansible.EnsureExternalSecrets once the external-secrets add-on is installed (the
# reconciler gates on that). Runs once on the first control plane - a ClusterSecretStore is a
# cluster-wide object, so for an HA control plane it must not run on every node.
- name: Wire the External Secrets Operator to Vault
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - external_secrets
