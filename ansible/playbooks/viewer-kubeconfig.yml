---
# Apply read-only RBAC and mint the viewer kubeconfig. Invoked by
# internal/config/ansible.EnsureViewerKubeconfig with extra-vars `cluster_name` + `artifacts_dir`.
# Runs once on the first control plane using the admin kubeconfig (the objects are cluster-wide, so
# for an HA control plane it must not run on every node). The wrapper reads artifacts_dir/viewer.conf.
- name: Ensure read-only viewer kubeconfig
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - viewer_kubeconfig
