---
# Rebuild a SOLE control plane from a stored etcd snapshot, onto a freshly re-provisioned VM.
# Invoked by internal/config/ansible.RestoreEtcdSnapshot with extra-vars target_node, target_ip and
# artifacts_dir (where the controller has already unpacked the sealed bundle it stored).
#
# This is the platform's ONLY lossy recovery, and the last rung of automatic repair. It exists for
# the one fault nothing else can reach: a single-control-plane cluster whose node is unrecoverable.
# Everywhere else the platform copies state off a live node before replacing it
# (backup-controlplane.yml) or leans on a surviving quorum member (remove-controlplane.yml + join) -
# both of which assume something is still running. When nothing is, a snapshot taken hours ago is
# the only state there is, and every API object written since it was taken is gone.
#
# WHY THIS IS A DIFFERENT PLAY FROM restore-controlplane.yml. That one restores a RAW copy of
# /var/lib/etcd, which comes back as the same member with no ceremony. A snapshot is not a data
# directory: it has to be materialised into one by `etcdutl snapshot restore`, and that command has
# to be told the member's identity - name, peer URL, initial cluster - because a snapshot does not
# carry one. Getting those wrong produces an etcd that starts and then refuses to join itself.
#
# The replacement VM reclaimed the old node's IP via its pinned MAC, so the restored certs (keyed on
# that IP) and the member identity below are still the right ones.
#
# Idempotent: guarded by /etc/kubernetes/snapshot-restore.done, so a retry after success is a no-op.
- name: Restore a sole control plane from a stored etcd snapshot
  hosts: "{{ target_node | default('control_plane') }}"
  become: true
  gather_facts: false
  vars:
    restore_dir: /root/kaas-restore
  pre_tasks:
    - name: Wait for SSH (the node was just re-created)
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
  roles:
    - common
  tasks:
    - name: Check whether this node has already been restored
      ansible.builtin.stat:
        path: /etc/kubernetes/snapshot-restore.done
      register: restored

    - name: Restore etcd from the snapshot and start the control plane
      when: not restored.stat.exists
      block:
        - name: Create the staging directory
          ansible.builtin.file:
            path: "{{ restore_dir }}"
            state: directory
            mode: '0700'

        - name: Copy the snapshot to the node
          ansible.builtin.copy:
            src: "{{ artifacts_dir }}/restore/snapshot.db"
            dest: "{{ restore_dir }}/snapshot.db"
            mode: '0600'

        - name: Copy the /etc/kubernetes archive to the node
          ansible.builtin.copy:
            src: "{{ artifacts_dir }}/restore/kube-etc.tar.gz"
            dest: "{{ restore_dir }}/kube-etc.tar.gz"
            mode: '0600'

        - name: Copy the kubelet state archive to the node
          ansible.builtin.copy:
            src: "{{ artifacts_dir }}/restore/kubelet.tar.gz"
            dest: "{{ restore_dir }}/kubelet.tar.gz"
            mode: '0600'

        - name: Stop kubelet while restoring
          ansible.builtin.systemd:
            name: kubelet
            state: stopped

        - name: Restore /etc/kubernetes (pki, manifests, kubeconfigs)
          # First, because everything below reads from it: the etcd static-pod manifest it contains
          # is what names the etcd image used to run the restore.
          ansible.builtin.shell: |
            set -e
            rm -rf /etc/kubernetes
            tar xzf {{ restore_dir }}/kube-etc.tar.gz -C /
          changed_when: true

        - name: Restore the kubelet state directory (config.yaml, client certs)
          ansible.builtin.shell: |
            set -e
            rm -rf /var/lib/kubelet
            tar xzf {{ restore_dir }}/kubelet.tar.gz -C /var/lib
          changed_when: true

        - name: Read the etcd image from the restored static-pod manifest
          # The manifest is the authority on which etcd version this cluster runs, so the restore is
          # performed with the SAME binary that wrote the snapshot rather than whatever happens to be
          # newest. Self-describing, and it means no version has to be threaded in as a variable.
          ansible.builtin.shell: |
            set -euo pipefail
            grep -oP '^\s+image:\s+\K\S+' /etc/kubernetes/manifests/etcd.yaml | head -1
          args:
            executable: /bin/bash
          register: etcd_image
          changed_when: false

        - name: Materialise a data directory from the snapshot
          # etcdutl lives only inside the etcd image - there is no cluster to `kubectl exec` into on a
          # node being rebuilt from nothing, so the image is run directly through containerd. It is
          # already on the node: kubeadm pre-pulls it, and the golden image bakes that in.
          #
          # The four identity flags are the whole reason this is not a `tar xzf`. A snapshot carries
          # no member identity, so `snapshot restore` invents one - name "default", peer URL
          # localhost - and an etcd started against that data directory would not match the peer URL
          # in the restored manifest and would never come up. The node reclaimed its old IP, so the
          # identity below is the one the cluster already believes in.
          ansible.builtin.shell: |
            set -euo pipefail
            rm -rf /var/lib/etcd
            ctr -n k8s.io run --rm --net-host \
              --mount type=bind,src=/var/lib,dst=/var/lib,options=rbind:rw \
              --mount type=bind,src={{ restore_dir }},dst={{ restore_dir }},options=rbind:ro \
              {{ etcd_image.stdout | trim }} kaas-etcd-restore \
              etcdutl snapshot restore {{ restore_dir }}/snapshot.db \
                --name {{ target_node }} \
                --initial-cluster {{ target_node }}=https://{{ target_ip }}:2380 \
                --initial-advertise-peer-urls https://{{ target_ip }}:2380 \
                --data-dir /var/lib/etcd
          args:
            executable: /bin/bash
          changed_when: true

        - name: Start kubelet (brings up the restored static control-plane pods)
          ansible.builtin.systemd:
            name: kubelet
            state: started
            enabled: true

        - name: Wait for the API server to become healthy
          ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/healthz
          register: healthz
          until: healthz.rc == 0 and healthz.stdout == 'ok'
          retries: 30
          delay: 10
          changed_when: false

        # /healthz only confirms the API server itself; Ready additionally needs kubelet and the CNI.
        # The reconciler treats the repair as done once this returns, so waiting here means it does
        # not declare the cluster recovered before it is genuinely serving.
        - name: Wait for this control plane's node to report Ready
          ansible.builtin.command: >
            kubectl --kubeconfig /etc/kubernetes/admin.conf wait node/{{ target_node }}
            --for=condition=Ready --timeout=300s
          changed_when: false

        - name: Remove the staging directory
          # It holds the cluster's entire keyspace in plaintext. It does not stay on the node.
          ansible.builtin.file:
            path: "{{ restore_dir }}"
            state: absent

        - name: Mark the restore complete
          ansible.builtin.file:
            path: /etc/kubernetes/snapshot-restore.done
            state: touch
            mode: '0644'
