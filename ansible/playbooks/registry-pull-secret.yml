---
# Apply the cluster's image-registry pull secret. Invoked by
# internal/config/ansible.EnsureRegistryPullSecret once the cluster's registry project and robot have
# been provisioned (reconcileRegistryWiring). Runs once on the first control plane - a Secret is a
# namespaced object, so applying it per control-plane node would be redundant work on an HA cluster.
#
# Idempotent: `kubectl apply` of a generated Secret, so a re-run with the same credential changes
# nothing and a re-run with a rotated one converges.
- name: Apply the cluster's registry pull secret
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - registry_pull_secret
