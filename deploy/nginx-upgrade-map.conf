# WebSocket support for the /api/ reverse proxy (deploy/nginx.conf). This map lives at http-level
# (nginx includes /etc/nginx/conf.d/*.conf inside http{}), so it cannot go in the server block.
#
# It derives the value the proxy sends as `Connection` from the request's `Upgrade` header:
#   - a WebSocket request (Upgrade: websocket) -> Connection: upgrade
#   - everything else, including SSE (no Upgrade header) -> Connection: '' (cleared)
# That keeps the live provisioning SSE stream working while enabling the cluster-shell WebSocket
# (GET /api/clusters/{id}/shell).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
