# The portal's front door. Serves the built SPA and reverse-proxies the control-plane API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The container DNS server, substituted at start-up from /etc/resolv.conf (see
    # deploy/nginx-resolver.sh). Required for the re-resolution below.
    #__RESOLVER__

    # API reverse proxy, mapping the SPA's `/api/clusters` to the Go API's root route `/clusters`
    # (the API is unchanged).
    #
    # The upstream goes through a VARIABLE, not a literal `proxy_pass http://api:8080/`. With a
    # literal, nginx resolves the name ONCE at start-up and caches it forever - so with several api
    # replicas it would pin whatever addresses existed at boot and keep proxying to a replica that
    # has since been replaced (502s), never seeing one that scaled up. With a variable plus a
    # resolver, nginx re-resolves per request (honouring `valid=`), which is what makes `api` a
    # load-balanced, freely-scalable service rather than a fixed address.
    #
    # A variable in proxy_pass turns off the URI rewriting the trailing slash used to do, so the
    # prefix is now stripped explicitly with `rewrite ... break`.
    #
    # The address itself is overridable with KAAS_API_UPSTREAM (substituted at start-up by
    # deploy/nginx-resolver.sh), because the API is not always called `api`: under the Helm chart
    # (deploy/helm) it is a Kubernetes Service named after the release.
    set $api_upstream api:8080;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket upgrade for the interactive cluster shell (GET /api/clusters/{id}/shell). The
        # $connection_upgrade map (deploy/nginx-upgrade-map.conf) yields "upgrade" for a WebSocket
        # and "" otherwise, so SSE (which sends no Upgrade header) is unaffected.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-Sent Events (the live provisioning stream) and the shell WebSocket: never buffer,
        # keep the connection open. Without proxy_buffering off the events would stall in nginx's
        # buffer; the long timeouts keep an idle terminal from being cut.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SPA client-side routing: fall back to index.html for any non-file path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
