# The load balancer in front of the scaled web/api replicas (deploy/compose.scale.yaml). It holds
# the two host ports the single-replica overlay would otherwise pin to one container, and fans each
# out over every replica of the service behind it.
#
# Balancing is DNS-based: the container runtime resolves a service name to the addresses of all its
# replicas, and because the upstream goes through a VARIABLE (with the `resolver` filled in at
# start-up by deploy/nginx-resolver.sh), nginx re-resolves it as replicas come and go instead of
# caching one set forever. No upstream{} block, so no static list to keep in sync with --scale.
#
# No sticky sessions anywhere, deliberately: the API keeps nothing per-connection that another
# replica couldn't serve (signed-cookie sessions; the event stream is fed by Postgres LISTEN/NOTIFY,
# not by in-process state), so any request may land on any replica.

# The portal.
server {
    listen 80;
    server_name _;

    #__RESOLVER__
    set $web_upstream web:80;

    location / {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The portal carries the shell WebSocket and the SSE event stream through to the API, so the
        # same upgrade + no-buffering rules as deploy/nginx.conf apply on this hop too.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# The raw JSON+SSE API, on the same :8081 it is published on unscaled (curl, scripts).
server {
    listen 81;
    server_name _;

    #__RESOLVER__
    set $api_upstream api:8080;

    location / {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
