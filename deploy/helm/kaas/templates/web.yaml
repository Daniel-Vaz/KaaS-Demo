{{/*
The portal: nginx serving the SPA and reverse-proxying /api to the API Service.

KAAS_API_UPSTREAM points it at the release's API Service (the image defaults to compose's `api:8080`).
nginx re-resolves that name per request - it goes through a variable, with the resolver filled in
from the pod's /etc/resolv.conf at start-up - so it follows API pods as they are rescheduled, scaled
or rolled, instead of caching one set of endpoint IPs forever.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaas.fullname" . }}-web
  labels:
    {{- include "kaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kaas.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaas.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "kaas.image" (dict "ctx" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # The FULLY-QUALIFIED Service name, deliberately. nginx's `resolver` queries the name
            # exactly as written - unlike libc, it does NOT apply the search domains from
            # /etc/resolv.conf - so a bare "kaas-api" resolves in the pod's shell but 502s in nginx.
            - name: KAAS_API_UPSTREAM
              value: {{ printf "%s-api.%s.svc.cluster.local:8080" (include "kaas.fullname" .) .Release.Namespace | quote }}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kaas.fullname" . }}-web
  labels:
    {{- include "kaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "kaas.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kaas.fullname" . }}-web
  labels:
    {{- include "kaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kaas.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
{{- end }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kaas.fullname" . }}-web
  labels:
    {{- include "kaas.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kaas.fullname" . }}-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
