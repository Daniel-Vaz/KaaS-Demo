{{- if not .Values.existingSecret }}
{{/*
Every credential the platform needs, in one Secret.

The two keys that MUST be stable across upgrades (the master encryption/signing key and the
API↔agent bearer token) are read back from the live Secret when they were generated rather than
configured - see kaas.secretKey in _helpers.tpl. Rotating the master key silently orphans every
stored kubeconfig, so it must never be regenerated by accident.

Production would not keep these in a Helm release at all: they would come from a KMS / External
Secrets / Vault, and the chart would only reference the Secret (set `existingSecret`). This is the
same deliberate shortcut the platform takes with KAAS_SECRET_KEY elsewhere - see
docs/architecture.md#fidelity.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaas.fullname" . }}
  labels:
    {{- include "kaas.labels" . | nindent 4 }}
type: Opaque
stringData:
  kaas-secret-key: {{ include "kaas.secretKey" . | quote }}
  kaas-shell-token: {{ include "kaas.shellToken" . | quote }}
  kaas-admin-password: {{ .Values.config.adminPassword | quote }}
  database-url: {{ include "kaas.databaseURL" . | quote }}

  {{- if eq (include "kaas.real" .) "true" }}
  # The API↔node-ssh bearer token. Separate from kaas-shell-token because the node-ssh sandbox holds
  # the VM key (below); only the api and nodessh Deployments read it. Real mode only - no node-ssh
  # sandbox is deployed in fake mode.
  kaas-node-ssh-token: {{ include "kaas.nodeSshToken" . | quote }}
  {{- end }}

  {{- if eq .Values.auth.mode "ldap" }}
  # The directory service account's password. Only the api Deployment mounts it - the worker never
  # authenticates a user. It lives here rather than in the ldap ConfigMap precisely so the mapping
  # config stays reviewable, mountable and non-secret.
  kaas-ldap-bind-password: {{ .Values.auth.ldap.bindPassword | quote }}
  {{- end }}

  {{- if has "vsphere" .Values.infra.providers }}
  # vCenter credential. Only the worker Deployment mounts it - same discipline as every other
  # provisioning secret (the api Deployment never provisions).
  vsphere-password: {{ .Values.infra.vsphere.password | quote }}
  {{- end }}
  {{- if has "proxmox" .Values.infra.providers }}
  # Proxmox VE credential: whichever half of the token/username-password pair is in use, worker
  # renders both keys unconditionally but only mounts the one values.infra.proxmox selects.
  proxmox-api-token: {{ .Values.infra.proxmox.apiToken | quote }}
  proxmox-password: {{ .Values.infra.proxmox.password | quote }}
  {{- end }}
  {{- if .Values.infra.netbox.url }}
  netbox-token: {{ .Values.infra.netbox.token | quote }}
  netbox-password: {{ .Values.infra.netbox.password | quote }}
  {{- end }}
  {{- if .Values.dns.baseDomain }}
  # The credential that writes the platform's delegated DNS zone. Worker-only - the api Deployment
  # never mounts it. The worker also hands it to each cluster's external-dns add-on (as a Secret in
  # that cluster), which is why one service account's reach is the platform's whole zone; see
  # internal/app/dns.go for what production would do instead.
  dns-krb-password: {{ .Values.dns.kerberos.password | quote }}
  dns-tsig-secret: {{ .Values.dns.tsig.secret | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- end }}

  {{- if eq (include "kaas.real" .) "true" }}
  # The key that opens the CLUSTER VMs the platform provisions (Ansible logs in with it).
  cluster-ssh-private-key: {{ .Values.config.clusterSSH.privateKey | quote }}
  {{- end }}

  {{- if and (eq (include "kaas.real" .) "true") (eq .Values.kvm.mode "remote") }}
  # The PLATFORM's key to the HYPERVISOR. It is mounted into the worker (which dials libvirtd and
  # hops Ansible through the host) and into the SOCKS tunnel pod - and deliberately NOWHERE ELSE.
  # In particular it never reaches the shell sandbox, which is why the sandbox routes through the
  # tunnel Service instead of opening its own.
  kvm-ssh-private-key: {{ .Values.kvm.ssh.privateKey | quote }}
  kvm-known-hosts: {{ .Values.kvm.ssh.knownHosts | quote }}
  {{- end }}
{{- end }}
