apiVersion: v2
name: kaas
description: |
  The KaaS-Demo control plane on Kubernetes: the web portal, the JSON+SSE API, the reconciler
  worker, and the unprivileged cluster-shell exec agent - every one of them horizontally scalable -
  plus (optionally) the Postgres that holds desired state and the durable job queue.
type: application

# Two versions, on two independent tag lines - see docs/deploy/releasing.md.
#
# `version` is the CHART's own: the deployment surface (templates, values, defaults). Bump it by
# hand here whenever that surface changes, and release it by pushing `chart-v<version>`. It is the
# only version in the repo that nothing else mirrors.
#
# `appVersion` is the PLATFORM this chart deploys, and it is a MIRROR of the root VERSION file -
# never edit it directly, run `make bump VERSION=x.y.z`. It is load-bearing rather than
# informational: `kaas.image` (templates/_helpers.tpl) resolves every image tag from it, so a
# drifted appVersion makes `helm install` pull a platform nobody released. `make release-check`,
# which CI runs on every PR, is what keeps them in step.
version: 0.1.0
appVersion: "0.1.0"

keywords:
  - kubernetes-as-a-service
  - control-plane
  - reconciliation
home: https://github.com/Daniel-Vaz/KaaS-demo
sources:
  - https://github.com/Daniel-Vaz/KaaS-demo
maintainers:
  - name: Daniel Vaz

# HashiCorp Vault, deployed alongside the platform (the tenant-facing secret store, internal/vault).
# Gated on vault.enabled so a deployment can point at an external Vault instead. `helm dependency
# update deploy/helm/kaas` vendors it into charts/ before install.
dependencies:
  - name: vault
    version: "0.28.1"
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled
